name: hand-off
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: create an file
        run: echo " the package of the file app" > app.txt
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: verify the file
        run: test -f app.txt
