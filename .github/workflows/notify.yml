name: notify-workflow
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    secrets:
      NOTIFY_TOKEN:
        required: true
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: echo " Notify for environment- ${{ inputs.environment}}"
      - name: Prove the secret arrived
        run: test -n "$TOKEN"
        env:
          TOKEN: ${{ secrets.NOTIFY_TOKEN }}
