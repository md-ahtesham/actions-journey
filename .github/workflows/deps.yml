name: deps
on: push
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip download
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{hashfiles('requirements.txt')}}
          restore-keys: |
            pip-{{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
