name: secret-checK
on: workflow_dispatch
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check APP_TOKEN is set
        env:
          APP_TOKEN : ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "APP_TOKEN is set"
          else
            echo "APP_TOKEN is Missing"
            exit 1
          fi
